<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Cemil Play V2</title>

<style>

body{
background:black;
color:white;
text-align:center;
font-family:Arial;
}

canvas{
background:black;
border:3px solid white;
}

.controls{
margin-top:20px;
}

.controls button{
width:70px;
height:70px;
font-size:25px;
margin:5px;
}

</style>
</head>

<body>

<h1>🎮 Cemil Play V2</h1>

<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
<br>
<button onclick="move('up')">⬆️</button><br>
<button onclick="move('left')">⬅️</button>
<button onclick="move('down')">⬇️</button>
<button onclick="move('right')">➡️</button>
</div>

<script>

let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");

let x = 200;
let y = 200;
let size = 20;

function draw(){
ctx.clearRect(0,0,400,400);

ctx.fillStyle="lime";
ctx.fillRect(x,y,size,size);
}

function move(dir){

if(dir=="up"){y-=20;}
if(dir=="down"){y+=20;}
if(dir=="left"){x-=20;}
if(dir=="right"){x+=20;}

draw();
}

document.addEventListener("keydown",function(e){

if(e.key=="ArrowUp"){move("up")}
